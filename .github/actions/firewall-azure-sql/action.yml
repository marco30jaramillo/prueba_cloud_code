name: Firewall de Azure SQL (regla temporal)
description: >
  Abre o cierra una regla temporal de firewall en Azure SQL con la IP publica del ejecutor.
  Usa una credencial propia (service principal) con permiso solo sobre el firewall del servidor.
  Los valores llegan como entradas desde un job con environment; este archivo no lee secretos.

inputs:
  accion:
    description: "abrir o cerrar"
    required: true
  nombre-regla:
    description: "Nombre de la regla temporal (el mismo al abrir y al cerrar)"
    required: true
  servidor:
    description: "Servidor SQL (DEPLOY_DB_SERVER, nombre corto o FQDN)"
    required: false
  grupo-recursos:
    description: "Grupo de recursos del servidor SQL (AZURE_SQL_RESOURCE_GROUP)"
    required: false
  suscripcion:
    description: "Id de la suscripcion (AZURE_SQL_SUBSCRIPTION_ID)"
    required: false
  tenant:
    description: "Tenant del service principal (AZURE_FIREWALL_TENANT_ID)"
    required: false
  cliente:
    description: "Client id del service principal (AZURE_FIREWALL_CLIENT_ID)"
    required: false
  secreto:
    description: "Client secret del service principal (AZURE_FIREWALL_CLIENT_SECRET)"
    required: false

runs:
  using: composite
  steps:
    - name: Verificar entradas
      shell: bash
      env:
        ACCION: ${{ inputs.accion }}
        SERVIDOR: ${{ inputs.servidor }}
        GRUPO: ${{ inputs.grupo-recursos }}
        SUSCRIPCION: ${{ inputs.suscripcion }}
        TENANT: ${{ inputs.tenant }}
        CLIENTE: ${{ inputs.cliente }}
        SECRETO: ${{ inputs.secreto }}
        NOMBRE_REGLA: ${{ inputs.nombre-regla }}
      run: |
        set -euo pipefail
        if [ -n "$SECRETO" ]; then echo "::add-mask::$SECRETO"; fi
        if [ "$ACCION" != "abrir" ] && [ "$ACCION" != "cerrar" ]; then
          echo "::error::La accion debe ser 'abrir' o 'cerrar'."
          exit 1
        fi
        if ! [[ "$NOMBRE_REGLA" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
          echo "::error::Nombre de regla invalido."
          exit 1
        fi
        faltan=""
        [ -z "$SERVIDOR" ]    && faltan="$faltan DEPLOY_DB_SERVER"
        [ -z "$GRUPO" ]       && faltan="$faltan AZURE_SQL_RESOURCE_GROUP"
        [ -z "$SUSCRIPCION" ] && faltan="$faltan AZURE_SQL_SUBSCRIPTION_ID"
        [ -z "$TENANT" ]      && faltan="$faltan AZURE_FIREWALL_TENANT_ID"
        [ -z "$CLIENTE" ]     && faltan="$faltan AZURE_FIREWALL_CLIENT_ID"
        [ -z "$SECRETO" ]     && faltan="$faltan AZURE_FIREWALL_CLIENT_SECRET"
        if [ -n "$faltan" ]; then
          echo "::error::Faltan secretos del ambiente para el firewall de Azure SQL:$faltan"
          exit 1
        fi

    - name: Abrir o cerrar la regla
      shell: bash
      env:
        ACCION: ${{ inputs.accion }}
        SERVIDOR: ${{ inputs.servidor }}
        GRUPO: ${{ inputs.grupo-recursos }}
        SUSCRIPCION: ${{ inputs.suscripcion }}
        TENANT: ${{ inputs.tenant }}
        CLIENTE: ${{ inputs.cliente }}
        SECRETO: ${{ inputs.secreto }}
        NOMBRE_REGLA: ${{ inputs.nombre-regla }}
      run: |
        set -euo pipefail
        # Valores derivados de secretos: se enmascaran antes de usarlos.
        servidor_corto="${SERVIDOR%%.*}"
        echo "::add-mask::$servidor_corto"
        echo "::add-mask::$GRUPO"
        echo "::add-mask::$SUSCRIPCION"
        echo "::add-mask::$TENANT"
        echo "::add-mask::$CLIENTE"

        iniciar_sesion() {
          az login --service-principal --username "$CLIENTE" --password "$SECRETO" \
            --tenant "$TENANT" --output none
        }

        if [ "$ACCION" = "abrir" ]; then
          iniciar_sesion
          az account set --subscription "$SUSCRIPCION"

          # IP valida: cuatro octetos <= 255, publica (ni privada ni loopback ni reservada).
          ip_publica_valida() {
            local ip="$1" o1 o2 o
            [[ "$ip" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || return 1
            for o in 1 2 3 4; do
              [ "$((10#${BASH_REMATCH[$o]}))" -le 255 ] || return 1
            done
            o1=$((10#${BASH_REMATCH[1]}))
            o2=$((10#${BASH_REMATCH[2]}))
            [ "$o1" -eq 0 ] && return 1
            [ "$o1" -eq 10 ] && return 1
            [ "$o1" -eq 127 ] && return 1
            [ "$o1" -ge 224 ] && return 1
            [ "$o1" -eq 169 ] && [ "$o2" -eq 254 ] && return 1
            [ "$o1" -eq 172 ] && [ "$o2" -ge 16 ] && [ "$o2" -le 31 ] && return 1
            [ "$o1" -eq 192 ] && [ "$o2" -eq 168 ] && return 1
            [ "$o1" -eq 100 ] && [ "$o2" -ge 64 ] && [ "$o2" -le 127 ] && return 1
            return 0
          }

          ip_a="$(curl -fsS --max-time 20 https://api.ipify.org | tr -d '[:space:]')"
          ip_b="$(curl -fsS --max-time 20 https://checkip.amazonaws.com | tr -d '[:space:]')"
          if ! ip_publica_valida "$ip_a" || ! ip_publica_valida "$ip_b"; then
            echo "::error::No se obtuvo una IP publica valida del ejecutor."
            exit 1
          fi
          if [ "$ip_a" != "$ip_b" ]; then
            echo "::error::Las dos fuentes de IP publica no coinciden; no se abre el firewall."
            exit 1
          fi
          ip="$ip_a"
          echo "::add-mask::$ip"

          az sql server firewall-rule create \
            --resource-group "$GRUPO" --server "$servidor_corto" \
            --name "$NOMBRE_REGLA" --start-ip-address "$ip" --end-ip-address "$ip" \
            --output none

          # La regla tarda minutos en propagarse: se confirma que existe y se espera.
          existe=0
          for intento in 1 2 3 4 5; do
            if az sql server firewall-rule show \
                 --resource-group "$GRUPO" --server "$servidor_corto" \
                 --name "$NOMBRE_REGLA" --output none 2>/dev/null; then
              existe=1
              break
            fi
            sleep 10
          done
          if [ "$existe" -ne 1 ]; then
            echo "::error::La regla temporal no aparece tras crearla."
            exit 1
          fi
          echo "Regla creada; esperando propagacion del firewall (90 s)."
          sleep 90
          echo "Regla temporal de firewall abierta."
        else
          # Cierre: se reintenta y, si no se logra cerrar, el job falla de forma visible.
          sesion=0
          for intento in 1 2 3; do
            if iniciar_sesion; then sesion=1; break; fi
            sleep 10
          done
          if [ "$sesion" -ne 1 ]; then
            echo "::error::REGLA ABIERTA $NOMBRE_REGLA: borrar a mano (no fue posible iniciar sesion en Azure)."
            exit 1
          fi
          az account set --subscription "$SUSCRIPCION"

          cerrada=0
          for intento in 1 2 3; do
            if salida="$(az sql server firewall-rule delete \
                 --resource-group "$GRUPO" --server "$servidor_corto" \
                 --name "$NOMBRE_REGLA" --output none 2>&1)"; then
              cerrada=1
              break
            fi
            # Solo "no encontrada" cuenta como ya cerrada; cualquier otro error falla.
            if printf '%s' "$salida" | grep -qiE 'ResourceNotFound|NotFound|was not found|could not be found'; then
              cerrada=1
              break
            fi
            sleep 10
          done
          if [ "$cerrada" -ne 1 ]; then
            echo "::error::REGLA ABIERTA $NOMBRE_REGLA: borrar a mano."
            exit 1
          fi
          echo "Regla temporal de firewall cerrada."
        fi
        az logout --output none 2>/dev/null || true
