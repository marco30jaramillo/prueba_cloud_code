name: Desplegar release

# Orquestador del despliegue a QA: validar -> cambios -> base-de-datos -> backend -> frontend
# -> pruebas-release -> release-pr y movil (en paralelo).
#
# Solo se despliega lo que cambio: el job cambios busca, para backend, frontend y movil, el
# ultimo commit con el que ese job termino bien en una ejecucion anterior de este workflow (QA es
# uno solo, venga de la rama release que venga) y lo compara con el actual. Si la carpeta del
# componente (backend/, frontend/, mobile/) no cambio, su job pasa en verde sin desplegar, asi la
# cadena sigue y pruebas-release igual corre. Se despliega todo si cambio algo en .github/, si no
# hay despliegue anterior registrado o con el disparo manual 'forzar-despliegue'. La base de
# datos y las pruebas corren siempre (el ejecutor de base ya aplica solo lo pendiente).
# Estructura: los pasos de pruebas del release (tarea 9) y de apertura del PR hacia main
# (tarea 10) son los jobs pruebas-release y release-pr de ESTE archivo, no workflows
# separados, para que el orden y las dependencias vivan en un solo orquestador.
# Modo efectivo: en push es siempre 'aplicar'. En disparo manual, solo 'aplicar' continua
# despues de base-de-datos; dry-run, baseline e inicializar terminan ahi (sin backend,
# frontend, pruebas ni PR).
# Solo se dispara con push a release/** y con disparo manual. El despliegue a produccion
# (rama main, ambiente produccion) se agrega aparte, cuando ese ambiente exista.
#
# Por que el despliegue de backend y frontend vive en ESTE archivo: los jobs que llamaban a
# workflows reutilizables (uses:) con el ambiente declarado dentro del workflow llamado no
# recibian los secretos del ambiente qa (publish-profile llegaba vacio, KAN-67). Aqui cada
# job declara environment: qa en el propio job, igual que base-de-datos.
#
# Node 22: tedious 20 (dependencia de mssql 12) exige Node >= 22 y Node 20 ya no tiene soporte.
# El runtime del App Service debe coincidir con esta version (Node 22 o superior).
#
# Firewall de Azure SQL: lo controla la variable de ambiente FIREWALL_MODO (vars, no secreto).
#   - Vacia o sin definir (por defecto): no se usa regla temporal; la base se migra directo.
#     Asume que el servidor SQL tiene activada la opcion "Permitir servicios de Azure".
#   - 'regla-temporal': antes de migrar se abre una regla con la IP del ejecutor y al final
#     se cierra (siempre). Exige cinco secretos del ambiente: AZURE_SQL_RESOURCE_GROUP,
#     AZURE_SQL_SUBSCRIPTION_ID, AZURE_FIREWALL_TENANT_ID, AZURE_FIREWALL_CLIENT_ID y
#     AZURE_FIREWALL_CLIENT_SECRET.
#
# Aviso: el nombre de la base escrito en la entrada confirmar-base es visible en claro en un
# repositorio publico (entradas del disparo manual y registro de ejecuciones).
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      modo-base:
        description: "Modo de base de datos"
        type: choice
        options:
          - aplicar
          - dry-run
          - baseline
          - inicializar
        default: aplicar
      confirmar-base:
        description: "Solo baseline o inicializar (dry-run y aplicar no la piden): escribir el nombre exacto de la base"
        type: string
        required: false
        default: ''
      forzar-despliegue:
        description: "Desplegar backend, frontend y movil aunque no hayan cambiado"
        type: boolean
        default: false

# Grupo fijo: un solo despliegue a QA a la vez aunque haya varias ramas release/**.
# Un despliegue en curso nunca se cancela; los demas esperan.
concurrency:
  group: desplegar-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: validar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      modo: ${{ steps.version.outputs.modo }}
    steps:
      # Sin checkout y sin secretos: solo se comprueba la referencia.
      - name: Validar rama y derivar version
        id: version
        env:
          REFERENCIA: ${{ github.ref }}
          MODO_ENTRADA: ${{ inputs.modo-base || 'aplicar' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$REFERENCIA" =~ ^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Solo se despliega desde una rama release/vX.Y.Z."
            exit 1
          fi
          version="${REFERENCIA#refs/heads/release/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          modo="$MODO_ENTRADA"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then modo="aplicar"; fi
          if ! [[ "$modo" =~ ^(aplicar|dry-run|baseline|inicializar)$ ]]; then
            echo "::error::Modo de base de datos invalido."
            exit 1
          fi
          echo "modo=$modo" >> "$GITHUB_OUTPUT"

  cambios:
    name: cambios
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.comparar.outputs.backend }}
      frontend: ${{ steps.comparar.outputs.frontend }}
      movil: ${{ steps.comparar.outputs.movil }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comparar con el ultimo despliegue de cada componente
        id: comparar
        env:
          GH_TOKEN: ${{ github.token }}
          FORZAR: ${{ inputs.forzar-despliegue || false }}
        shell: bash
        run: |
          set -euo pipefail
          # Carpeta de cada componente (el nombre es el del job). Un cambio en .github/ despliega todo.
          declare -A CARPETA=([backend]=backend [frontend]=frontend [movil]=mobile)
          declare -A ULTIMO=()

          # Ejecuciones terminadas de este workflow, de la mas reciente a la mas antigua.
          ejecuciones="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/desplegar-release.yml/runs?status=completed&per_page=50" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
          while read -r id sha; do
            [ -n "$id" ] || continue
            exitosos=" $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "success") | .name] | join(" ")') "
            faltan=0
            for c in "${!CARPETA[@]}"; do
              if [ -z "${ULTIMO[$c]:-}" ]; then
                if [[ "$exitosos" == *" $c "* ]]; then ULTIMO[$c]="$sha"; else faltan=1; fi
              fi
            done
            if [ "$faltan" -eq 0 ]; then break; fi
          done <<< "$ejecuciones"

          {
            echo "### Componentes a desplegar"
            echo ""
            echo "| Componente | Ultimo despliegue | Despliega | Motivo |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for c in backend frontend movil; do
            base="${ULTIMO[$c]:-}"
            if [ "$FORZAR" = "true" ]; then
              despliega=true; motivo="disparo manual con forzar-despliegue"
            elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              despliega=true; motivo="sin despliegue anterior registrado"
            elif ! git diff --quiet "$base" HEAD -- .github/; then
              despliega=true; motivo="cambio la configuracion del pipeline (.github/)"
            elif ! git diff --quiet "$base" HEAD -- "${CARPETA[$c]}/"; then
              despliega=true; motivo="cambio ${CARPETA[$c]}/"
            else
              despliega=false; motivo="sin cambios en ${CARPETA[$c]}/"
            fi
            echo "$c=$despliega" >> "$GITHUB_OUTPUT"
            echo "| $c | ${base:0:7} | $despliega | $motivo |" >> "$GITHUB_STEP_SUMMARY"
            echo "$c: $despliega ($motivo)"
          done

  base-de-datos:
    name: base-de-datos
    needs: validar
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 30
    env:
      FIREWALL_REGLA: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "Sin package-lock.json en backend: se usa npm install (sin lockfile estricto)."
            npm install
          fi

      - name: Enmascarar valores derivados
        env:
          DB_SERVER: ${{ secrets.DEPLOY_DB_SERVER }}
          DB_DATABASE: ${{ secrets.DEPLOY_DB_DATABASE }}
          DB_USER: ${{ secrets.DEPLOY_DB_USER }}
        shell: bash
        run: |
          for v in "$DB_SERVER" "$DB_DATABASE" "$DB_USER" "${DB_SERVER%%.*}"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

      - name: Abrir regla temporal de firewall
        if: ${{ vars.FIREWALL_MODO == 'regla-temporal' }}
        uses: ./.github/actions/firewall-azure-sql
        with:
          accion: abrir
          nombre-regla: ${{ env.FIREWALL_REGLA }}
          servidor: ${{ secrets.DEPLOY_DB_SERVER }}
          grupo-recursos: ${{ secrets.AZURE_SQL_RESOURCE_GROUP }}
          suscripcion: ${{ secrets.AZURE_SQL_SUBSCRIPTION_ID }}
          tenant: ${{ secrets.AZURE_FIREWALL_TENANT_ID }}
          cliente: ${{ secrets.AZURE_FIREWALL_CLIENT_ID }}
          secreto: ${{ secrets.AZURE_FIREWALL_CLIENT_SECRET }}

      - name: Migrar base de datos
        working-directory: backend
        shell: bash
        env:
          DEPLOY_DB_SERVER: ${{ secrets.DEPLOY_DB_SERVER }}
          DEPLOY_DB_DATABASE: ${{ secrets.DEPLOY_DB_DATABASE }}
          DEPLOY_DB_USER: ${{ secrets.DEPLOY_DB_USER }}
          DEPLOY_DB_PASSWORD: ${{ secrets.DEPLOY_DB_PASSWORD }}
          MODO_BASE: ${{ inputs.modo-base || 'aplicar' }}
          CONFIRMAR_BASE: ${{ inputs.confirmar-base }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: |
          set -euo pipefail
          # En el despliegue automatico (push) el modo es siempre 'aplicar'.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then MODO_BASE="aplicar"; fi
          if ! [[ "$MODO_BASE" =~ ^(aplicar|dry-run|baseline|inicializar)$ ]]; then
            echo "::error::Modo de base de datos invalido."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalida."
            exit 1
          fi
          argumentos=(--modo "$MODO_BASE" --version "$VERSION")
          if [ "$MODO_BASE" = "baseline" ] || [ "$MODO_BASE" = "inicializar" ]; then
            argumentos+=(--confirmar-base "$CONFIRMAR_BASE")
          fi
          salida="$RUNNER_TEMP/db-migrate.log"
          node scripts/db-migrate.js "${argumentos[@]}" 2>&1 | tee "$salida"
          punto="$(grep -E '^PUNTO_RESTAURACION_UTC=' "$salida" | tail -n 1 || true)"
          if [ -z "$punto" ]; then
            echo "::error::El ejecutor no informo PUNTO_RESTAURACION_UTC; el despliegue se detiene."
            exit 1
          fi
          {
            echo "### Base de datos (modo: $MODO_BASE, version: $VERSION)"
            echo ""
            echo "$punto"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumen de modo sin despliegue
        if: ${{ needs.validar.outputs.modo != 'aplicar' }}
        env:
          MODO: ${{ needs.validar.outputs.modo }}
        shell: bash
        run: |
          {
            echo ""
            echo "**Modo $MODO: el flujo termina aqui.** No se despliega backend ni frontend,"
            echo "no se ejecutan las pruebas del release y no se abre el pull request hacia main."
            echo "Solo el modo 'aplicar' completa el despliegue."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar regla temporal de firewall
        if: ${{ always() && vars.FIREWALL_MODO == 'regla-temporal' }}
        uses: ./.github/actions/firewall-azure-sql
        with:
          accion: cerrar
          nombre-regla: ${{ env.FIREWALL_REGLA }}
          servidor: ${{ secrets.DEPLOY_DB_SERVER }}
          grupo-recursos: ${{ secrets.AZURE_SQL_RESOURCE_GROUP }}
          suscripcion: ${{ secrets.AZURE_SQL_SUBSCRIPTION_ID }}
          tenant: ${{ secrets.AZURE_FIREWALL_TENANT_ID }}
          cliente: ${{ secrets.AZURE_FIREWALL_CLIENT_ID }}
          secreto: ${{ secrets.AZURE_FIREWALL_CLIENT_SECRET }}

  backend:
    name: backend
    needs: [validar, cambios, base-de-datos]
    if: ${{ needs.validar.outputs.modo == 'aplicar' }}
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verificar secretos del ambiente
        env:
          AZURE_BACKEND_APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          AZURE_BACKEND_PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        shell: bash
        run: |
          faltan=0
          for nombre in AZURE_BACKEND_APP_NAME AZURE_BACKEND_PUBLISH_PROFILE; do
            if [ -z "${!nombre}" ]; then
              echo "::error::El secreto $nombre llego vacio al job backend (ambiente qa)."
              faltan=1
            fi
          done
          if [ "$faltan" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Sin cambios en backend
        if: ${{ needs.cambios.outputs.backend != 'true' }}
        shell: bash
        run: echo "backend/ no cambio desde su ultimo despliegue en QA; no se despliega." >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: ${{ needs.cambios.outputs.backend == 'true' }}
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            echo "Sin package-lock.json en backend: se usa npm install (sin lockfile estricto)."
            npm install --omit=dev
          fi

      - name: Deploy to Azure App Service
        if: ${{ needs.cambios.outputs.backend == 'true' }}
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: backend

  frontend:
    name: frontend
    needs: [validar, cambios, backend]
    if: ${{ needs.validar.outputs.modo == 'aplicar' && needs.backend.result == 'success' }}
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verificar secretos del ambiente
        env:
          AZURE_FRONTEND_APP_NAME: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          AZURE_FRONTEND_PUBLISH_PROFILE: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        shell: bash
        run: |
          faltan=0
          for nombre in AZURE_FRONTEND_APP_NAME AZURE_FRONTEND_PUBLISH_PROFILE NEXT_PUBLIC_API_URL; do
            if [ -z "${!nombre}" ]; then
              echo "::error::El secreto $nombre llego vacio al job frontend (ambiente qa)."
              faltan=1
            fi
          done
          if [ "$faltan" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Sin cambios en frontend
        if: ${{ needs.cambios.outputs.frontend != 'true' }}
        shell: bash
        run: echo "frontend/ no cambio desde su ultimo despliegue en QA; no se despliega." >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: ${{ needs.cambios.outputs.frontend == 'true' }}
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "Sin package-lock.json en frontend: se usa npm install (sin lockfile estricto)."
            npm install
          fi

      - name: Build
        if: ${{ needs.cambios.outputs.frontend == 'true' }}
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # Se sube solo la build autocontenida (server.js + dependencias usadas + estaticos), no la
      # carpeta frontend con node_modules completo y la cache de la build.
      - name: Empaquetar frontend
        if: ${{ needs.cambios.outputs.frontend == 'true' }}
        run: node scripts/empaquetar-standalone.mjs "$RUNNER_TEMP/frontend-paquete"
        working-directory: frontend

      - name: Deploy to Azure App Service
        if: ${{ needs.cambios.outputs.frontend == 'true' }}
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/frontend-paquete

  # El nombre de este job es el check requerido en el ruleset de main.
  pruebas-release:
    name: pruebas-release
    needs: [validar, frontend]
    if: ${{ needs.validar.outputs.modo == 'aplicar' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      resultado: ${{ steps.pruebas.outputs.resultado }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Detectar y ejecutar pruebas
        id: pruebas
        shell: bash
        run: |
          set -euo pipefail
          instalar_dependencias() {
            if [ -f package-lock.json ]; then
              npm ci
            else
              echo "Sin package-lock.json en $(basename "$PWD"): se usa npm install (sin lockfile estricto)."
              npm install
            fi
          }
          hay_backend=0
          hay_frontend=0
          if compgen -G "backend/tests/*.test.js" > /dev/null; then hay_backend=1; fi
          if [ -f frontend/package.json ] && node -e "const s=require('./frontend/package.json').scripts; process.exit(s && s.test ? 0 : 1)"; then
            hay_frontend=1
          fi

          if [ "$hay_backend" -eq 0 ] && [ "$hay_frontend" -eq 0 ]; then
            echo "Sin pruebas, Omitir" >> "$GITHUB_STEP_SUMMARY"
            echo "Sin pruebas, Omitir"
            echo "resultado=Sin pruebas, Omitir" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$hay_backend" -eq 1 ]; then
            echo "::group::Pruebas del backend"
            (cd backend && instalar_dependencias && node --test tests/*.test.js)
            echo "::endgroup::"
          fi
          if [ "$hay_frontend" -eq 1 ]; then
            echo "::group::Pruebas del frontend"
            (cd frontend && instalar_dependencias && npm test)
            echo "::endgroup::"
          fi

          echo "Pruebas del release: aprobadas" >> "$GITHUB_STEP_SUMMARY"
          echo "resultado=aprobadas" >> "$GITHUB_OUTPUT"

  # App movil de QA (perfil qa de mobile/eas.json, APK): EAS Update si solo cambio JavaScript,
  # build nueva si cambio la parte nativa. La logica esta en .github/actions/eas-desplegar.
  # Exige el secreto EXPO_TOKEN en el ambiente qa.
  movil:
    name: movil
    needs: [validar, cambios, pruebas-release]
    if: ${{ needs.validar.outputs.modo == 'aplicar' && needs.pruebas-release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Sin cambios en mobile
        if: ${{ needs.cambios.outputs.movil != 'true' }}
        shell: bash
        run: echo "mobile/ no cambio desde su ultimo despliegue en QA; no se publica update ni build." >> "$GITHUB_STEP_SUMMARY"

      - name: Desplegar app movil de QA
        if: ${{ needs.cambios.outputs.movil == 'true' }}
        uses: ./.github/actions/eas-desplegar
        with:
          perfil: qa
          version: ${{ needs.validar.outputs.version }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  release-pr:
    name: release-pr
    needs: [validar, pruebas-release]
    if: ${{ needs.validar.outputs.modo == 'aplicar' && needs.pruebas-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Abrir pull request hacia main
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.ref_name }}
          VERSION: ${{ needs.validar.outputs.version }}
          RESULTADO: ${{ needs.pruebas-release.outputs.resultado }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalida."
            exit 1
          fi

          existentes="$(gh pr list --head "$RAMA" --base main --state open --json number --jq 'length')"
          if [ "$existentes" != "0" ]; then
            echo "Ya existe un pull request abierto de $RAMA hacia main; no se duplica."
            exit 0
          fi

          if ultimo_tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null)"; then
            rango="$ultimo_tag..HEAD"
          else
            ultimo_tag="(ninguno)"
            rango="HEAD"
          fi
          claves="$(git log "$rango" --format='%s%n%b' | grep -oE 'KAN-[0-9]+' | sort -u | paste -sd ',' - | sed 's/,/, /g' || true)"

          titulo="release $VERSION"
          if [ -n "$claves" ]; then titulo="$titulo: $claves"; fi

          cuerpo="$RUNNER_TEMP/cuerpo-pr.md"
          {
            echo "## Release $VERSION"
            echo ""
            echo "- Resultado de las pruebas del release: **$RESULTADO**"
            echo "- Ultimo tag considerado: $ultimo_tag"
            echo "- Claves de Jira incluidas: ${claves:-ninguna}"
            echo ""
            echo "Despliegue a QA completado en la ejecucion $GITHUB_RUN_ID."
          } > "$cuerpo"

          gh pr create --base main --head "$RAMA" --title "$titulo" --body-file "$cuerpo"
